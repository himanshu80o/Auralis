name: Auralis
options: {deploymentTarget: {iOS: "17.0"}}
targets:
  Auralis:
    type: application
    platform: iOS
    sources: [Sources]
    settings: {PRODUCT_BUNDLE_IDENTIFIER: com.example.auralis, SWIFT_VERSION: "5.9", TARGETED_DEVICE_FAMILY: "1,2", ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AURALIS
        UIBackgroundModes: [audio]
        NSAppleMusicUsageDescription: "Auralis scans your music library to list and play your songs."
        NSPhotoLibraryUsageDescription: "Auralis finds videos in your Photos library so you can watch them. Nothing is uploaded."
        UILaunchScreen: {}
